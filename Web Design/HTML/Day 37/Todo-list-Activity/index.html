<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="card">
    <h1>My To-Do List</h1>

    <ul class="todo-list">
      <li class="todo-item">
        <label class="todo-header">
          <input type="checkbox">
          <span>Explore gaming keyboards</span>
        </label>
        <ul class="todo-sub">
          <li><a href="#">Store link</a></li>
        </ul>
      </li>

      <li class="todo-item">
        <label class="todo-header">
          <input type="checkbox">
          <span>Finish the report</span>
        </label>
        <ul class="todo-sub">
          <li><a href="#">Request Access</a></li>
        </ul>
      </li>

      <li class="todo-item">
        <label class="todo-header">
          <input type="checkbox">
          <span>View Phone's Warranty</span>
        </label>
        <ul class="todo-sub">
          <li><a href="#">View Receipts</a></li>
        </ul>
      </li>
    </ul>

  </main>

</body>
</html>
