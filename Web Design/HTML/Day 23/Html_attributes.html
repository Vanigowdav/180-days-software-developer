<!--Attribute: is a value placed inside the opening tag of an Html element.-->
<!--Attributes provide additional information about the element or specify how the element should behave.-->

<!-- Syntax : <element attribute = "value"></element> -->
<!-- The attribute name is followed by an equal sign (=) and a value in quotes, The value can be a string or a number, depending on the attribute.-->

<!-- 1. href and target attributes with a element-->
<!--href - specifies URL of link
    target - Specifies where to open the link
    a  - element known as anchor element, used to create a hyperlinks 
       - The text element the opening and closing a tags is the clickable part users select to navigate.-->
    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Link Example</title>
</head>
<body>
    <h1>HTML Attributes</h1>
    <p>
        Visit the official
        <a href ="https://www.w3schools.com" targer="_blank">W3Schools website.</a> 
        <!-- blank : Opens the link in a new tab or window-->
    </p>
    <p>
        Go to the 
        <a href=""https://mozilla.org" target="_self">MDN Web Docs</a>
        <!-- _self : Openfs the link in the same tab or frame-->
    </p>

    
</body>
</html>
