<!-- 1. LINK ELEMENT: Used to link to external resources like stylesheets and site icons.
        syntax: <link rel="stylesheet" href="./style.css"/
                 rel attribute : used to specify the relationship betweem the linked resources and the HTML document.
                 link element : developers use for their exter css file insted of writing everything in HTML doc.
                 href attribute : specify location of URL for external resources.
                 . followed by / (slash) : tells computer to look in the current folder or directory for style.css field
                 * link element placed inside the head element.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>LINK Element/title>
    <link rel="stylesheet" href="./stylesheet.css"/>
</head>

</body>
</html>
