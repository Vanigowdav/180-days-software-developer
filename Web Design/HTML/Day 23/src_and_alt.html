<!--src and alt which used to specify the source of an image and provide alternative descriptive text for the image.
    - src and alt attributes with img element-->

<!-- src : attribute used to specify the location for that image.
     alt : attribute is used to provide , short, descriptive text for the images.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Image Example</title>
</head>
<body>
    <h1>HTML src and alt attributes</h1>
    <p>Below is a photo of a cute puppy.</p>
    <img src="https://unsplash.com"
         alt="A fluffy brown and white puppy sitting on green grass looking unsplash
         width="400">
</body>
</html>

<!--src : Specifies the url path where your image file is located. This can be a web link (absolute URL) 
          local file folder(relative URL)
    alt : Describes what is inside the image. It is critical for two reasons:
     * Accessibility: Screen readers read this text aloud to visually impaired users.
     * Fallback : If the image fails to load due to bad internet , the browser displays this text instead.-->
